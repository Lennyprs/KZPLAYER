name: Build KZ Player APK (signed)

# Se lance a la main (bouton "Run workflow") ou a chaque push sur main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Generer le wrapper Gradle si absent
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper absent ou incomplet -> generation dans un build isole (n'analyse PAS le projet Android)"
            WRAPGEN="$RUNNER_TEMP/wrapgen"
            mkdir -p "$WRAPGEN"
            # Gradle 9+ exige un settings.gradle pour reconnaitre un build : on cree un mini build vide et isole.
            echo 'rootProject.name = "wrapgen"' > "$WRAPGEN/settings.gradle"
            ( cd "$WRAPGEN" && gradle wrapper --gradle-version 8.7 --distribution-type bin )
            mkdir -p gradle/wrapper
            cp "$WRAPGEN/gradlew" ./gradlew
            cp "$WRAPGEN/gradlew.bat" ./gradlew.bat 2>/dev/null || true
            cp "$WRAPGEN/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            cp "$WRAPGEN/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x ./gradlew
          echo "=== Verification du wrapper ==="
          ls -l ./gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties

      - name: Build release (APK non signe)
        env:
          # v392 : force VERSION_CODE = run_number + 400 pour rester au-dessus des
          # anciens builds Kozukaa (391-392). Doit correspondre au tag ci-dessous.
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew clean :app:assembleRelease --no-daemon --stacktrace

      - name: Decoder le keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/kz-release.jks"

      - name: Aligner et signer l'APK
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/kz-release.jks" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out app-release-signed.apk \
            app-release-aligned.apk

      - name: Verifier la signature
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs app-release-signed.apk

      - name: Uploader l'APK signe (artifact v4)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          if-no-files-found: error

      - name: Creer la Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          # v392 : tag = run_number + 400 pour rester au-dessus des anciens builds
          # Kozukaa (jusqu a v391). Ainsi l auto-update dans l app (qui compare le
          # tag "vN" au versionCode installe) voit bien les nouvelles versions.
          tag_name: v${{ github.run_number + 400 }}
          name: KZ Player v${{ github.run_number + 400 }}
          files: app-release-signed.apk
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
