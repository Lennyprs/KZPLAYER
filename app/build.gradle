plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kzplayer.app'
    compileSdk 35

    defaultConfig {
        applicationId (System.getenv("BRAND_PACKAGE") ?: "com.kzplayer.app")
        buildConfigField "String", "BRAND_ID", "\"${System.getenv('BRAND_ID') ?: ''}\""
        minSdk 21
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // VERSION_CODE fourni par le workflow, sinon run_number + 400.
        def vcEnv = System.getenv("VERSION_CODE")
        def vcCode
        if (vcEnv != null && vcEnv.isInteger()) {
            vcCode = vcEnv.toInteger()
        } else {
            def runRaw = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
            def runNum = runRaw.isInteger() ? runRaw.toInteger() : 1
            vcCode = runNum + 400
        }

        versionCode vcCode
        versionName "3.7.9"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Media3 1.6.0 : sans garantie de compatibilite Dolby universelle.
    implementation 'androidx.media3:media3-exoplayer:1.6.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.6.0'
    implementation 'androidx.media3:media3-ui:1.6.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.6.0'

    // Decodeur audio FFmpeg conserve.
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'io.coil-kt:coil:2.4.0'
}